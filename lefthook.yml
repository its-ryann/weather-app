commit-msg:
  commands:
    conventional-commit:
      run: |
        commit_msg=$(cat {1})
        pattern="^(feat|fix|chore|docs|test|refactor|ci|style|perf)(\([a-z0-9-]+\))?: .{1,72}$"
        if ! echo "$commit_msg" | grep -qE "$pattern"; then
          echo "❌ Commit message doesn't follow Conventional Commits format."
          echo "   Expected: type(scope): summary"
          echo "   Types: feat, fix, chore, docs, test, refactor, ci, style, perf"
          echo "   Got: $commit_msg"
          exit 1
        fi
